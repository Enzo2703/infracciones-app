name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'   

      - name: Dar permisos a Maven Wrapper (por si existe)
        run: chmod +x mvnw || true

      - name: Ejecutar tests
        run: |
          if [ -f mvnw ]; then
            ./mvnw clean test
          else
            mvn clean test
          fi
